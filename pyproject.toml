[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codexd-bridge"
version = "0.1.0"
description = "MCP access to independent Codex App Servers with explicit provider binding"
requires-python = ">=3.11"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE", "COMMERCIAL-LICENSE.md"]
readme = "README.md"
dependencies = ["mcp==2.3.0", "websockets==16.1.1"]

[project.scripts]
codexd-bridge = "codexd_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/codexd-bridge/skills/codexd-bridge" = ["skills/codexd-bridge/SKILL.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

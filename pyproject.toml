[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "codexd-bridge"
dynamic = ["version"]
description = "MCP access to independent Codex App Servers with explicit provider binding"
requires-python = ">=3.11"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE", "COMMERCIAL-LICENSE.md"]
readme = "README.md"
dependencies = ["mcp==2.3.0", "websockets==16.1.1", "prompt-toolkit==3.0.53"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/Aegyce/codexd-bridge"
Issues = "https://github.com/Aegyce/codexd-bridge/issues"

[project.scripts]
codexd-bridge = "codexd_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codexd_bridge = ["skill/SKILL.md"]

[tool.setuptools.dynamic]
version = {attr = "codexd_bridge.__version__"}

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation .
      - name: Check code and shell scripts
        run: |
          ruff check src tests scripts
          bash -n install.sh uninstall.sh
          git diff --check
      - name: Test source and MCP stdio
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests
      - name: Build source archive and wheel
        if: matrix.python == '3.12'
        run: python scripts/build_release.py
      - name: Audit runtime dependencies
        if: matrix.python == '3.12'
        run: pip-audit --requirement requirements.lock --disable-pip --no-deps --format json --output tmp/dependency-audit.json
      - name: Install, upgrade and uninstall the release archive
        if: matrix.python == '3.12'
        run: python scripts/validate_install.py
      - name: Save release artifacts
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: |
            tmp/release-v*/*.whl
            tmp/release-v*/*.tar.gz
            tmp/release-v*/SHA256SUMS
            tmp/release-v*/release-notes.txt
            tmp/dependency-audit.json
          if-no-files-found: error
          retention-days: 14
